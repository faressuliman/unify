name: Build and Deploy Unify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create frontend build env file
        run: |
          printf "%s" "${{ secrets.FRONTEND_ENV_FILE }}" > frontend/.env.production

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Remove frontend build env file
        run: rm -f frontend/.env.production

      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npm run build --if-present

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy_bundle/frontend deploy_bundle/backend
          cp -r frontend/dist deploy_bundle/frontend/
          cp backend/package*.json deploy_bundle/backend/
          cp backend/index.js deploy_bundle/backend/
          cp -r backend/src deploy_bundle/backend/
          tar -czf deploy_bundle.tar.gz -C deploy_bundle .

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Upload bundle to server
        run: |
          scp -i ~/.ssh/deploy_key deploy_bundle.tar.gz deploy@${{ secrets.SERVER_IP }}:/tmp/deploy_bundle.tar.gz

      - name: Upload backend env file
        run: |
          printf "%s" "${{ secrets.BACKEND_ENV_FILE }}" > backend.env
          scp -i ~/.ssh/deploy_key backend.env deploy@${{ secrets.SERVER_IP }}:/tmp/unify_backend.env
          rm -f backend.env

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.SERVER_IP }} '
            set -e
            mkdir -p /var/www/unify
            tar -xzf /tmp/deploy_bundle.tar.gz -C /var/www/unify
            rm -f /tmp/deploy_bundle.tar.gz

            mv /tmp/unify_backend.env /var/www/unify/backend/.env
            chmod 600 /var/www/unify/backend/.env

            cd /var/www/unify/backend
            npm ci --omit=dev

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            pm2 describe unify-backend >/dev/null 2>&1 && \
              pm2 restart unify-backend --update-env || \
              pm2 start index.js --name unify-backend

            pm2 save
          '